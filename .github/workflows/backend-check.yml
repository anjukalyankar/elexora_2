name: Backend checks

on:
  push:
    branches:
      - fix/syntax-error-2666-clean
  pull_request:
    branches:
      - main

jobs:
  syntax-and-import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Tesseract OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile all backend Python files
        run: python -m compileall -q backend
      - name: Import FastAPI application
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/elexora
        run: python -c "from backend.app.main import app; print('FastAPI import OK:', app.title)"
      - name: Test admin MLFB helpers and 3AH3 position decoder
        run: python -m unittest backend.tests.test_admin_mlfb -v
